# main에 푸시하면 EAS Update로 새 버전을 올린다 → PC가 꺼져 있어도 폰의 Expo Go에서 최신을 열 수 있다.
# 설정 순서는 docs/EAS-UPDATE.md. EXPO_TOKEN(GitHub Secrets)과 app.json의 extra.eas.projectId가 있어야 돈다.
# 둘 중 하나라도 없으면 아무것도 올리지 않고 이유만 남기고 끝난다 (실패로 처리하지 않는다).

name: EAS Update

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'netlify.toml'
      - 'public/**'
  workflow_dispatch:

concurrency:
  group: eas-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 설정 확인 (projectId · 토큰)
        id: check
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Secrets에 EXPO_TOKEN이 없어 EAS Update를 건너뜁니다. docs/EAS-UPDATE.md 3번을 보세요."
          elif ! node -e "const e=require('./app.json').expo;process.exit(e.extra&&e.extra.eas&&e.extra.eas.projectId&&e.updates&&e.updates.url?0:1)"; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::app.json에 extra.eas.projectId / updates.url이 없어 건너뜁니다. docs/EAS-UPDATE.md 2번을 보세요."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        if: steps.check.outputs.ready == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 의존성 설치
        if: steps.check.outputs.ready == 'true'
        run: npm ci

      - name: 타입체크 · 테스트
        if: steps.check.outputs.ready == 'true'
        run: |
          npx tsc --noEmit
          npx jest --ci

      - name: EAS Update 올리기
        if: steps.check.outputs.ready == 'true'
        env:
          # 커밋 메시지를 셸 명령에 직접 끼워 넣지 않는다 (따옴표 · $() 주입 방지)
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'manual run' }}
        run: eas update --branch main --message "$COMMIT_MESSAGE" --non-interactive
